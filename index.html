<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ngochi & Ndezo's School of Champions — Servant Leadership Academy</title>
<meta name="description" content="A 21-week servant leadership academy by Innocent Forteh. Deep transformation of the heart, character and leadership of the next generation of African champions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f1410;
  --ink-soft:#243024;
  --paper:#f6efe1;
  --paper-warm:#ede2c8;
  --paper-deep:#e3d4b3;
  --emerald:#0e3b2e;
  --emerald-deep:#072018;
  --emerald-mid:#185c45;
  --gold:#b08628;
  --gold-bright:#d6a83c;
  --gold-deep:#7a5a18;
  --terracotta:#a14a25;
  --crimson:#7a1f1f;
  --rule:rgba(15,20,16,.18);
  --rule-strong:rgba(15,20,16,.42);
  --serif:"Fraunces", "Cormorant Garamond", Georgia, serif;
  --display:"Cormorant Garamond", "Fraunces", Georgia, serif;
  --body:"Inter", system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--body);
  background:var(--paper);
  color:var(--ink);
  font-size:16px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(ellipse at top left, rgba(176,134,40,.06), transparent 50%),
    radial-gradient(ellipse at bottom right, rgba(14,59,46,.05), transparent 60%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .06 0 0 0 0 .055 0 0 0 0 .04 0 0 0 .12 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
a{color:var(--emerald);text-decoration:none}
a:hover{color:var(--gold-deep)}
button{font-family:inherit;cursor:pointer}

/* ============ TYPOGRAPHY ============ */
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;color:var(--ink);margin:0}
.display{font-family:var(--display);font-weight:500;font-style:italic}
.eyebrow{font-family:var(--body);font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-deep);font-weight:600}
.kicker{font-family:var(--display);font-style:italic;color:var(--emerald-mid);font-size:1.15em}

/* ============ APP SHELL ============ */
#app{min-height:100vh;display:flex;flex-direction:column}
.crest-mark{
  width:46px;height:46px;flex:0 0 46px;
  display:flex;align-items:center;justify-content:center;
  background:var(--emerald-deep);color:var(--gold-bright);
  font-family:var(--serif);font-weight:700;font-size:22px;
  border-radius:50%;
  border:2px solid var(--gold);
  box-shadow:inset 0 0 0 3px var(--emerald-deep), 0 2px 6px rgba(0,0,0,.18);
}
.crest-mark.lg{width:88px;height:88px;flex:0 0 88px;font-size:42px;border-width:3px;box-shadow:inset 0 0 0 5px var(--emerald-deep), 0 4px 14px rgba(0,0,0,.2)}

/* TOP BAR */
.topbar{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg, rgba(7,32,24,.96), rgba(14,59,46,.96));
  color:var(--paper);
  border-bottom:1px solid var(--gold-deep);
  backdrop-filter:blur(8px);
}
.topbar .inner{max-width:1240px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:18px}
.topbar h1{color:var(--paper);font-size:19px;font-weight:600;line-height:1.1}
.topbar h1 small{display:block;font-family:var(--body);font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-bright);font-weight:600;margin-top:2px}
.topbar nav{margin-left:auto;display:flex;align-items:center;gap:8px}
.topbar nav button, .topbar nav .navbtn{
  background:transparent;border:1px solid transparent;color:var(--paper);
  padding:8px 14px;border-radius:2px;font-size:13px;font-weight:500;letter-spacing:.04em;
  transition:all .2s;
}
.topbar nav button:hover{border-color:var(--gold);color:var(--gold-bright)}
.topbar nav button.active{border-color:var(--gold-bright);color:var(--gold-bright);background:rgba(214,168,60,.08)}
.lang-switch{display:flex;border:1px solid var(--gold-deep);border-radius:2px;overflow:hidden;margin-left:8px}
.lang-switch button{border:none;border-radius:0;padding:7px 11px;font-size:11px;letter-spacing:.16em;font-weight:700}
.lang-switch button.active{background:var(--gold);color:var(--emerald-deep)}

/* PAGE CONTAINER */
.page{flex:1;max-width:1240px;width:100%;margin:0 auto;padding:48px 28px 96px}
.page-narrow{max-width:880px}

/* BUTTONS */
.btn{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--emerald-deep);color:var(--paper);
  border:1px solid var(--emerald-deep);
  padding:14px 28px;
  font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  border-radius:2px;cursor:pointer;transition:all .25s;
}
.btn:hover{background:var(--gold);color:var(--emerald-deep);border-color:var(--gold)}
.btn.gold{background:var(--gold);color:var(--emerald-deep);border-color:var(--gold)}
.btn.gold:hover{background:var(--gold-bright);border-color:var(--gold-bright)}
.btn.ghost{background:transparent;color:var(--emerald);border-color:var(--emerald)}
.btn.ghost:hover{background:var(--emerald);color:var(--paper)}
.btn.danger{background:transparent;color:var(--crimson);border-color:var(--crimson)}
.btn.danger:hover{background:var(--crimson);color:var(--paper)}
.btn.sm{padding:9px 18px;font-size:11px;letter-spacing:.14em}

/* INPUTS */
.field{display:block;margin-bottom:20px}
.field label{display:block;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-deep);font-weight:600;margin-bottom:8px}
.field input, .field textarea{
  width:100%;padding:14px 16px;
  background:rgba(255,255,255,.55);
  border:1px solid var(--rule-strong);
  border-radius:2px;
  font-family:var(--serif);font-size:18px;color:var(--ink);
  transition:all .2s;
}
.field input:focus, .field textarea:focus{
  outline:none;border-color:var(--gold);background:#fff;
  box-shadow:0 0 0 3px rgba(176,134,40,.15);
}
.field textarea{font-family:var(--serif);font-size:17px;line-height:1.7;min-height:160px;resize:vertical}

/* DECORATIVE */
.ornament{
  display:flex;align-items:center;gap:14px;margin:24px 0;color:var(--gold-deep);
}
.ornament::before, .ornament::after{
  content:"";flex:1;height:1px;background:var(--gold-deep);opacity:.5;
}
.ornament svg{flex:0 0 auto}

.scripture{
  font-family:var(--display);font-style:italic;
  font-size:1.32em;line-height:1.55;color:var(--ink-soft);
  border-left:3px solid var(--gold);
  padding:6px 0 6px 22px;margin:24px 0;
}
.scripture cite{
  display:block;font-style:normal;font-family:var(--body);
  font-size:.7em;letter-spacing:.22em;text-transform:uppercase;
  color:var(--gold-deep);margin-top:10px;font-weight:600;
}

/* CARDS */
.card{
  background:rgba(255,255,255,.55);
  border:1px solid var(--rule);
  padding:32px;
  border-radius:2px;
  position:relative;
}
.card.deep{background:linear-gradient(180deg, var(--emerald-deep), var(--emerald));color:var(--paper)}
.card.deep h2,.card.deep h3{color:var(--paper)}
.card.parchment{
  background:linear-gradient(180deg,#f9f1da,#ede2c8);
  border:1px solid var(--gold-deep);
  box-shadow:inset 0 0 0 1px rgba(176,134,40,.2), 0 1px 3px rgba(0,0,0,.06);
}

/* ======================== LANDING ======================== */
.hero{
  min-height:calc(100vh - 70px);
  display:grid;
  grid-template-columns:1.15fr .85fr;
  align-items:center;gap:60px;
  padding:60px 28px 80px;
  max-width:1240px;margin:0 auto;
}
.hero-art{
  position:relative;aspect-ratio:1/1.18;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(214,168,60,.5), transparent 55%),
    linear-gradient(155deg, var(--emerald-deep) 0%, var(--emerald) 50%, var(--emerald-mid) 100%);
  border:1px solid var(--gold);
  box-shadow:inset 0 0 0 6px rgba(7,32,24,.65), 0 18px 50px -10px rgba(7,32,24,.4);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.hero-art::before{
  content:"";position:absolute;inset:18px;border:1px dashed rgba(214,168,60,.4);pointer-events:none;
}
.hero-art-inner{text-align:center;color:var(--gold-bright);padding:30px;position:relative;z-index:2}
.hero-art-inner .crest-mark{margin:0 auto 18px;width:108px;height:108px;font-size:54px}
.hero-art-inner h3{color:var(--gold-bright);font-size:34px;line-height:1.05;font-style:italic;font-family:var(--display);margin-bottom:8px}
.hero-art-inner p{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--paper);opacity:.85}
.hero-art .corner{position:absolute;width:40px;height:40px;border:1px solid var(--gold);opacity:.7}
.hero-art .corner.tl{top:8px;left:8px;border-right:none;border-bottom:none}
.hero-art .corner.tr{top:8px;right:8px;border-left:none;border-bottom:none}
.hero-art .corner.bl{bottom:8px;left:8px;border-right:none;border-top:none}
.hero-art .corner.br{bottom:8px;right:8px;border-left:none;border-top:none}

.hero h2{
  font-size:clamp(48px, 7vw, 88px);line-height:.95;
  font-weight:600;letter-spacing:-.02em;
  margin:18px 0 22px;
}
.hero h2 em{font-family:var(--display);font-style:italic;color:var(--emerald);font-weight:500}
.hero .lede{font-size:21px;line-height:1.55;color:var(--ink-soft);max-width:540px;margin-bottom:32px;font-family:var(--serif)}
.hero .meta{display:flex;gap:26px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-deep);font-weight:600;margin-top:30px;flex-wrap:wrap}
.hero .meta span{display:flex;align-items:center;gap:8px}
.hero .meta b{color:var(--ink);font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:0;text-transform:none}

@media(max-width:880px){
  .hero{grid-template-columns:1fr;gap:40px;padding-top:30px}
  .hero-art{order:-1;aspect-ratio:1.2/1;max-height:340px;margin:0 auto;width:100%;max-width:380px}
}

/* SECTIONS */
.section{padding:80px 28px;max-width:1240px;margin:0 auto}
.section h2.sec-title{font-size:clamp(34px,4.5vw,56px);line-height:1.05;margin-bottom:14px}
.section h2.sec-title em{font-family:var(--display);font-style:italic;color:var(--emerald)}
.section .sec-lede{font-family:var(--serif);font-size:20px;line-height:1.6;color:var(--ink-soft);max-width:720px;margin-bottom:48px}

.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule)}
.pillar{background:var(--paper);padding:32px 26px}
.pillar .num{font-family:var(--display);font-style:italic;font-size:46px;color:var(--gold);line-height:1}
.pillar h4{font-size:21px;margin:14px 0 10px}
.pillar p{font-size:14.5px;color:var(--ink-soft);line-height:1.6}
@media(max-width:880px){.pillars{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.pillars{grid-template-columns:1fr}}

.curriculum-list{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--rule)}
.curriculum-list .item{padding:18px 0;border-bottom:1px solid var(--rule);display:flex;align-items:baseline;gap:18px;padding-right:24px}
.curriculum-list .item .wk{font-family:var(--display);font-style:italic;font-size:32px;color:var(--gold-deep);min-width:52px;line-height:1}
.curriculum-list .item .ti{font-family:var(--serif);font-size:18px;line-height:1.3}
.curriculum-list .item .ti small{display:block;font-family:var(--body);font-size:11.5px;color:var(--ink-soft);margin-top:3px;letter-spacing:.02em}
@media(max-width:720px){.curriculum-list{grid-template-columns:1fr}}

.testimonial-block{
  background:var(--emerald-deep);color:var(--paper);
  padding:60px 40px;text-align:center;margin:60px 0;
  border-top:3px solid var(--gold);border-bottom:3px solid var(--gold);
}
.testimonial-block blockquote{
  font-family:var(--display);font-style:italic;font-size:clamp(24px,3vw,38px);
  line-height:1.35;max-width:840px;margin:0 auto 24px;color:var(--gold-bright);
}
.testimonial-block cite{font-style:normal;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--paper);opacity:.85}

footer.foot{
  background:var(--emerald-deep);color:var(--paper);
  padding:50px 28px;margin-top:auto;
  border-top:3px solid var(--gold);
}
footer.foot .inner{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:50px}
footer.foot h5{color:var(--gold-bright);font-family:var(--body);font-size:11px;letter-spacing:.28em;text-transform:uppercase;font-weight:600;margin:0 0 16px}
footer.foot p{font-size:14px;line-height:1.6;color:rgba(246,239,225,.78)}
footer.foot a{color:var(--gold-bright)}
footer.foot a:hover{color:var(--paper)}
footer.foot .copyline{margin-top:32px;padding-top:20px;border-top:1px solid rgba(214,168,60,.25);font-size:12px;letter-spacing:.1em;color:rgba(246,239,225,.6);text-align:center}
@media(max-width:720px){footer.foot .inner{grid-template-columns:1fr;gap:32px}}

/* ============ DASHBOARD ============ */
.dash-head{
  display:grid;grid-template-columns:1.4fr 1fr;gap:40px;align-items:end;
  padding-bottom:32px;border-bottom:1px solid var(--rule);margin-bottom:40px;
}
.dash-head h2{font-size:clamp(34px,4.5vw,52px);line-height:1.05}
.dash-head h2 em{font-family:var(--display);font-style:italic;color:var(--emerald)}
.dash-head .progress-card{background:var(--emerald-deep);color:var(--paper);padding:26px 30px;border:1px solid var(--gold-deep)}
.dash-head .progress-card .lbl{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-bright);font-weight:600}
.dash-head .progress-card .big{font-family:var(--display);font-style:italic;font-size:64px;line-height:1;color:var(--gold-bright);margin:6px 0}
.dash-head .progress-card .bar{height:6px;background:rgba(255,255,255,.12);border-radius:0;overflow:hidden;margin-top:14px}
.dash-head .progress-card .bar i{display:block;height:100%;background:linear-gradient(90deg, var(--gold), var(--gold-bright));transition:width .8s}

@media(max-width:780px){.dash-head{grid-template-columns:1fr}}

.modules-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
@media(max-width:980px){.modules-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.modules-grid{grid-template-columns:1fr}}

.module-card{
  background:#fff;
  border:1px solid var(--rule);
  padding:26px 24px 22px;
  position:relative;cursor:pointer;
  transition:all .25s;
  display:flex;flex-direction:column;
}
.module-card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 8px 24px -8px rgba(7,32,24,.18)}
.module-card.locked{opacity:.55;cursor:not-allowed;background:rgba(255,255,255,.4)}
.module-card.locked:hover{transform:none;border-color:var(--rule);box-shadow:none}
.module-card.done{background:linear-gradient(180deg,#fdfaf0,#f6efe1);border-color:var(--gold)}
.module-card .row1{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.module-card .wk-num{font-family:var(--display);font-style:italic;font-size:32px;color:var(--gold-deep);line-height:1}
.module-card .badge{font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;padding:4px 10px;border-radius:1px}
.module-card .badge.todo{color:var(--ink-soft);border:1px solid var(--rule-strong)}
.module-card .badge.progress{color:var(--gold-deep);border:1px solid var(--gold-deep);background:rgba(176,134,40,.08)}
.module-card .badge.done{color:var(--paper);background:var(--emerald-deep)}
.module-card .badge.locked{color:var(--ink-soft);background:rgba(15,20,16,.05);border:1px solid var(--rule)}
.module-card h3{font-size:21px;line-height:1.18;margin:0 0 10px}
.module-card .summ{font-size:13.5px;color:var(--ink-soft);line-height:1.55;flex:1}
.module-card .footer-row{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--rule)}
.module-card .footer-row .meta{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-deep);font-weight:600}
.module-card .footer-row .arrow{color:var(--emerald);font-size:18px}

/* ============ MODULE PAGE ============ */
.mod-head{
  background:linear-gradient(155deg, var(--emerald-deep), var(--emerald));
  color:var(--paper);padding:50px 50px 60px;
  margin:-48px -28px 0;
  border-bottom:3px solid var(--gold);
  position:relative;overflow:hidden;
}
.mod-head::before{
  content:"";position:absolute;right:-40px;top:-40px;width:280px;height:280px;
  background:radial-gradient(circle, rgba(214,168,60,.18), transparent 70%);
  pointer-events:none;
}
.mod-head .crumb{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-bright);font-weight:600;margin-bottom:18px}
.mod-head .crumb a{color:var(--gold-bright)}
.mod-head .wk-no{font-family:var(--display);font-style:italic;font-size:22px;color:var(--gold-bright);margin-bottom:6px}
.mod-head h1{color:var(--paper);font-size:clamp(38px,5vw,62px);line-height:1.02;margin-bottom:20px;font-weight:500}
.mod-head h1 em{font-family:var(--display);font-style:italic;color:var(--gold-bright)}
.mod-head .mod-meta{display:flex;gap:32px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-bright);font-weight:600;flex-wrap:wrap}

.mod-body{
  max-width:780px;margin:0 auto;padding:50px 0 0;
}

/* tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule-strong);margin-bottom:36px;overflow-x:auto}
.tabs button{
  background:none;border:none;
  font-family:var(--serif);font-size:18px;
  padding:14px 22px 14px 0;margin-right:24px;
  color:var(--ink-soft);
  border-bottom:2px solid transparent;margin-bottom:-1px;
  white-space:nowrap;
}
.tabs button.active{color:var(--ink);border-bottom-color:var(--gold)}
.tabs button .step-no{font-family:var(--display);font-style:italic;color:var(--gold-deep);margin-right:8px;font-size:.85em}
.tabs button:disabled{opacity:.4;cursor:not-allowed}

/* prose */
.prose{font-family:var(--serif);font-size:19px;line-height:1.8;color:var(--ink)}
.prose p{margin:0 0 22px}
.prose h3{font-size:30px;margin:42px 0 16px;color:var(--emerald-deep);font-weight:600}
.prose h4{font-size:22px;margin:32px 0 12px;font-weight:600}
.prose ul, .prose ol{margin:0 0 22px;padding-left:24px}
.prose li{margin-bottom:10px}
.prose strong{color:var(--emerald-deep);font-weight:700}
.prose em{font-style:italic}
.prose .pullquote{
  font-family:var(--display);font-style:italic;font-size:28px;line-height:1.35;
  color:var(--emerald);
  border-top:1px solid var(--gold-deep);border-bottom:1px solid var(--gold-deep);
  padding:24px 0;margin:36px 0;text-align:center;
}

/* assignment list */
.assignment{background:var(--paper-warm);padding:30px;border:1px solid var(--gold-deep);margin:30px 0}
.assignment h4{color:var(--emerald-deep);margin-top:0}

/* QUIZ */
.quiz-q{
  background:#fff;
  border:1px solid var(--rule);
  padding:26px 28px;margin-bottom:18px;
}
.quiz-q .qno{font-family:var(--display);font-style:italic;font-size:18px;color:var(--gold-deep)}
.quiz-q .qtxt{font-family:var(--serif);font-size:19px;line-height:1.5;margin:8px 0 18px;color:var(--ink)}
.quiz-q .opts{display:flex;flex-direction:column;gap:10px}
.quiz-q label.opt{
  display:flex;align-items:flex-start;gap:14px;
  padding:14px 18px;
  border:1px solid var(--rule);
  cursor:pointer;transition:all .18s;
  font-family:var(--serif);font-size:16.5px;line-height:1.45;
}
.quiz-q label.opt:hover{border-color:var(--gold);background:rgba(176,134,40,.04)}
.quiz-q label.opt input{margin-top:4px;accent-color:var(--emerald)}
.quiz-q label.opt.correct{border-color:var(--emerald-mid);background:rgba(24,92,69,.08)}
.quiz-q label.opt.wrong{border-color:var(--crimson);background:rgba(122,31,31,.05)}
.quiz-q .feedback{margin-top:14px;padding:14px 16px;font-size:14.5px;line-height:1.55;font-family:var(--body);border-left:3px solid var(--gold)}
.quiz-q .feedback.correct{background:rgba(24,92,69,.07);border-left-color:var(--emerald-mid);color:var(--emerald-deep)}
.quiz-q .feedback.wrong{background:rgba(122,31,31,.05);border-left-color:var(--crimson);color:var(--crimson)}

.quiz-result{
  text-align:center;padding:50px 30px;background:var(--emerald-deep);color:var(--paper);
  margin:30px 0;border:2px solid var(--gold);
}
.quiz-result.fail{background:#3a1818;border-color:var(--crimson)}
.quiz-result .score{font-family:var(--display);font-style:italic;font-size:96px;color:var(--gold-bright);line-height:1}
.quiz-result.fail .score{color:#e88a8a}
.quiz-result h3{color:var(--paper);font-size:30px;margin:14px 0 8px}
.quiz-result p{font-family:var(--serif);font-size:18px;color:rgba(246,239,225,.85);max-width:520px;margin:0 auto 24px}

/* ============ CERTIFICATE ============ */
.cert-frame{
  background:linear-gradient(135deg,#fdf6e3,#f1e3bb);
  border:14px double var(--gold-deep);
  padding:60px 60px;
  position:relative;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.3), inset 0 0 0 2px var(--gold);
  max-width:980px;margin:0 auto;
  font-family:var(--serif);
  color:var(--ink);
  text-align:center;
}
.cert-frame::before, .cert-frame::after{
  content:"";position:absolute;width:80px;height:80px;
  background:
    radial-gradient(circle at center, var(--gold) 0%, transparent 60%);
  opacity:.3;pointer-events:none;
}
.cert-frame::before{top:-10px;left:-10px}
.cert-frame::after{bottom:-10px;right:-10px}
.cert-frame .cert-crest{margin:0 auto 22px}
.cert-frame .cert-school{
  font-family:var(--display);font-size:13px;letter-spacing:.42em;text-transform:uppercase;
  color:var(--emerald-deep);font-weight:600;
}
.cert-frame .cert-title{
  font-family:var(--display);font-style:italic;
  font-size:clamp(40px,6vw,72px);color:var(--emerald-deep);
  line-height:1;margin:14px 0 6px;font-weight:500;
}
.cert-frame .cert-sub{font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-deep);font-weight:600;margin-bottom:36px}
.cert-frame .cert-recipient{
  font-family:var(--display);font-size:46px;line-height:1.05;
  color:var(--ink);font-weight:500;
  border-top:1px solid var(--gold-deep);border-bottom:1px solid var(--gold-deep);
  padding:24px 30px;margin:8px auto;display:inline-block;min-width:60%;
}
.cert-frame .cert-text{font-size:18px;line-height:1.7;color:var(--ink-soft);max-width:620px;margin:30px auto;font-family:var(--serif)}
.cert-frame .cert-mod{font-style:italic;color:var(--emerald-deep);font-weight:600}
.cert-frame .cert-sig{
  display:grid;grid-template-columns:1fr 1fr;gap:60px;margin-top:50px;
  font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-deep);font-weight:600;
}
.cert-frame .cert-sig .col{border-top:1px solid var(--ink-soft);padding-top:8px}
.cert-frame .cert-sig .name{font-family:var(--display);font-style:italic;font-size:22px;color:var(--ink);text-transform:none;letter-spacing:0;margin-bottom:4px;font-weight:500}
.cert-frame .cert-seal{
  position:absolute;bottom:50px;right:55px;
  width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle, var(--gold) 0%, var(--gold-deep) 100%);
  color:var(--emerald-deep);display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-style:italic;font-weight:700;
  font-size:14px;line-height:1.1;text-align:center;padding:14px;
  border:3px solid var(--paper);box-shadow:0 4px 12px rgba(0,0,0,.25);
  transform:rotate(-12deg);
}
.cert-frame .cert-id{font-size:10px;letter-spacing:.2em;color:var(--gold-deep);margin-top:36px;text-transform:uppercase}

@media(max-width:720px){
  .cert-frame{padding:40px 24px;border-width:8px}
  .cert-frame .cert-sig{grid-template-columns:1fr;gap:30px}
  .cert-frame .cert-seal{position:static;margin:30px auto 0;transform:rotate(-8deg)}
}

/* AUTH MODAL */
.modal-bg{
  position:fixed;inset:0;background:rgba(7,32,24,.78);backdrop-filter:blur(6px);
  z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;
}
.modal{
  background:var(--paper);max-width:520px;width:100%;
  padding:48px 44px;
  border:1px solid var(--gold);
  position:relative;
  box-shadow:0 30px 80px -10px rgba(0,0,0,.4);
}
.modal h3{font-size:32px;margin-bottom:8px}
.modal h3 em{font-family:var(--display);font-style:italic;color:var(--emerald)}
.modal .sub{color:var(--ink-soft);font-family:var(--serif);font-size:17px;margin-bottom:28px}
.modal .close{position:absolute;top:14px;right:14px;background:none;border:none;font-size:24px;color:var(--ink-soft);cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center}

/* misc */
.spacer-md{height:30px}
.spacer-lg{height:60px}
.center{text-align:center}
.muted{color:var(--ink-soft)}
.flex-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.flex-row.between{justify-content:space-between}

/* Reflection journal */
.journal-entry{background:rgba(255,255,255,.6);border-left:3px solid var(--gold);padding:18px 22px;margin-bottom:16px}
.journal-entry .stamp{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-deep);font-weight:600;margin-bottom:6px}
.journal-entry .body{font-family:var(--serif);font-size:16px;line-height:1.65;white-space:pre-wrap}

/* print */
/* layout utilities used by app.js */
.container{max-width:1240px;margin:0 auto;padding:0 28px}
@media(max-width:680px){.container{padding:0 18px}}

.section-eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-deep);font-weight:600;margin-bottom:12px}
.section-title{font-family:var(--display);font-style:italic;font-weight:400;font-size:48px;line-height:1.1;color:var(--ink);margin:0}
.section-title em{font-style:italic;color:var(--emerald);font-weight:500}
@media(max-width:680px){.section-title{font-size:34px}}

.modtab:hover{color:var(--emerald)!important}

main{min-height:60vh;padding-bottom:80px}
input,textarea,button{font-family:inherit}
input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}

@media print{
  .topbar,.no-print,footer.foot{display:none !important}
  body{background:#fff}
  .cert-frame{box-shadow:none;break-inside:avoid;page-break-inside:avoid}
}
